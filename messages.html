<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6658e8">
    <meta name="description" content="Private messages for Campus Connect students.">
    <title>Messages | Campus Connect</title>
    <style>
        :root {
            color-scheme: light;
            --page: #f4f6fb;
            --panel: #fff;
            --text: #172033;
            --muted: #788198;
            --border: #e7eaf1;
            --primary: #6658e8;
            --received: #f0f2f8;
            --input: #f5f6fa;
        }

        body.dark-mode {
            color-scheme: dark;
            --page: #10131b;
            --panel: #191e29;
            --text: #f2f4fb;
            --muted: #a0a9bd;
            --border: #303747;
            --primary: #8175ff;
            --received: #282f3e;
            --input: #222938;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button, input, textarea { font: inherit; }
        button, a { -webkit-tap-highlight-color: transparent; }
        button { cursor: pointer; }
        button:disabled, textarea:disabled { cursor: not-allowed; opacity: .55; }
        button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
        }

        .app {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 18px;
            width: min(1500px, 100%);
            height: 100vh;
            height: 100dvh;
            min-height: 520px;
            margin: auto;
            padding: 18px;
        }

        .sidebar, .messaging {
            min-height: 0;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .sidebar { display: flex; flex-direction: column; padding: 24px 16px; }
        .brand { margin: 0 0 28px 8px; color: var(--primary); font-size: 21px; font-weight: 800; }
        .nav-link {
            display: block;
            margin-bottom: 6px;
            padding: 13px 12px;
            border-radius: 10px;
            color: var(--muted);
            text-decoration: none;
        }
        .nav-link:hover, .nav-link.active { background: var(--received); color: var(--primary); }
        .sidebar-bottom { display: grid; gap: 10px; margin-top: auto; }
        .theme-button, .logout-button, .icon-button {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: var(--text);
        }
        .theme-button, .logout-button { width: 100%; padding: 12px; text-align: left; }
        .messaging {
            display: grid;
            grid-template-columns: minmax(250px, 310px) minmax(0, 1fr);
            overflow: hidden;
        }
        .conversations { display: flex; min-height: 0; flex-direction: column; border-right: 1px solid var(--border); }
        .conversation-heading { padding: 22px 18px 12px; }
        .conversation-heading h1 { margin: 0 0 7px; font-size: 24px; }
        .conversation-heading p, .chat-person p { color: var(--muted); font-size: 13px; line-height: 1.5; }
        .conversation-heading p { margin: 0 0 14px; }
        .search {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--input);
            color: var(--text);
        }
        .conversation-list { overflow-y: auto; padding: 8px; }
        .conversation {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 11px;
            padding: 12px 10px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: var(--text);
            text-align: left;
        }
        .conversation:hover, .conversation.selected { background: var(--received); }
        .avatar {
            display: grid;
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-weight: bold;
        }
        .conversation-info { flex: 1; min-width: 0; }
        .conversation-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .conversation-name { overflow: hidden; font-size: 14px; font-weight: bold; text-overflow: ellipsis; white-space: nowrap; }
        .conversation-preview { display: block; overflow: hidden; margin-top: 6px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
        .unread { flex: 0 0 auto; padding: 3px 7px; border-radius: 20px; background: var(--primary); color: #fff; font-size: 10px; }
        .chat { display: flex; min-width: 0; min-height: 0; flex-direction: column; }
        .chat-header { display: flex; min-height: 78px; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
        .chat-person { flex: 1; min-width: 0; }
        .chat-person h2 { margin: 0 0 4px; font-size: 16px; }
        .chat-person p { margin: 0; font-size: 12px; }
        .icon-button { padding: 9px 11px; }
        .chat-messages { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 14px; overflow-y: auto; padding: 20px; }
        .empty-state { margin: auto; padding: 24px; color: var(--muted); line-height: 1.6; text-align: center; }
        .message { display: flex; max-width: min(78%, 460px); flex-direction: column; gap: 5px; }
        .message.sent { align-self: flex-end; align-items: flex-end; }
        .message.received { align-self: flex-start; align-items: flex-start; }
        .bubble { overflow-wrap: anywhere; padding: 11px 14px; border-radius: 17px; background: var(--received); line-height: 1.5; white-space: pre-wrap; }
        .message.sent .bubble { border-bottom-right-radius: 5px; background: var(--primary); color: #fff; }
        .message.received .bubble { border-bottom-left-radius: 5px; }
        .message-time { padding: 0 4px; color: var(--muted); font-size: 10px; }
        .chat-compose { padding: 13px 16px; border-top: 1px solid var(--border); }
        .compose-form { display: flex; align-items: flex-end; gap: 9px; }
        .compose-form textarea { min-width: 0; min-height: 46px; max-height: 130px; flex: 1; resize: none; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--input); color: var(--text); }
        .send-button { padding: 13px 16px; border: 0; border-radius: 12px; background: var(--primary); color: white; font-weight: bold; }
        .notice { min-height: 18px; margin: 8px 2px 0; color: var(--muted); font-size: 12px; }
        .notice.error { color: #c62828; }
        .back-button { display: none; }

        @media (max-width: 780px) {
            .app { display: block; height: 100dvh; min-height: 0; padding: 0; }
            .sidebar { display: none; }
            .messaging { display: block; height: 100%; border: 0; border-radius: 0; }
            .conversations { height: 100%; border-right: 0; }
            .chat { display: none; height: 100%; }
            .messaging.chat-open .conversations { display: none; }
            .messaging.chat-open .chat { display: flex; }
            .chat-header { min-height: 70px; padding: 10px; }
            .chat-messages { padding: 14px 11px; }
            .chat-compose { padding: 10px; }
            .message { max-width: 88%; }
            .back-button { display: inline-block; }
            .send-button { padding: 13px 12px; }
        }
    </style>
  <script type="module" crossorigin src="/assets/messages-TWrsrY9h.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-B8tWKQ1F.js">
</head>
<body>
    <main class="app">
        <aside class="sidebar">
            <div class="brand">✦ Campus Connect</div>
            <nav aria-label="Main navigation">
                <a class="nav-link" href="/">🏠 Home</a>
                <a class="nav-link active" href="/messages.html" aria-current="page">💬 Messages</a>
            </nav>
            <div class="sidebar-bottom">
                <button id="theme-toggle" class="theme-button" type="button" aria-pressed="false">🌙 Night Mode</button>
                <button id="logout-button" class="logout-button" type="button">Log out</button>
            </div>
        </aside>
        <section class="messaging" id="messaging">
            <aside class="conversations" id="conversations-panel">
                <header class="conversation-heading">
                    <h1>Messages</h1>
                    <p>Search students to start a private conversation.</p>
                    <label for="conversation-search" hidden>Search students</label>
                    <input id="conversation-search" class="search" type="search" placeholder="Search students..." autocomplete="off">
                </header>
                <div class="conversation-list" id="conversation-list" aria-label="Students and conversations"></div>
            </aside>
            <section class="chat" aria-label="Private chat">
                <header class="chat-header">
                    <button id="back-button" class="icon-button back-button" type="button" aria-label="Back to students">←</button>
                    <div class="avatar" id="chat-avatar" aria-hidden="true">?</div>
                    <div class="chat-person">
                        <h2 id="chat-name">Choose a student</h2>
                        <p id="chat-status">Messages are private to you and the recipient.</p>
                    </div>
                    <button id="theme-toggle-mobile" class="icon-button" type="button" aria-label="Switch theme" aria-pressed="false">🌙</button>
                </header>
                <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Messages">
                    <div class="empty-state">Select a student to view or start a conversation.</div>
                </div>
                <div class="chat-compose">
                    <form class="compose-form" id="message-form">
                        <label for="message-input" hidden>Write a message</label>
                        <textarea id="message-input" placeholder="Write a message..." rows="1" maxlength="5000" disabled required></textarea>
                        <button class="send-button" type="submit" id="send-button" disabled>Send ➤</button>
                    </form>
                    <p class="notice" id="message-notice" role="status"></p>
                </div>
            </section>
        </section>
    </main>
</body>
</html>
